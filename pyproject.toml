[project]
name = "hermes-agent-manager"
version = "1.0.0"
description = "CLI to install and manage Hermes agents linked to Frappe Manager sites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12"]

[project.urls]
Homepage = "https://github.com/UpGoTech/hermes-agent-manager"
Repository = "https://github.com/UpGoTech/hermes-agent-manager"
Issues = "https://github.com/UpGoTech/hermes-agent-manager/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ham = "hermes_agent_manager.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_agent_manager", "hermes_agent_manager.*"]
namespaces = false

[tool.setuptools.package-data]
"hermes_agent_manager" = [
  "image/*",
  "frappe_app/ham_bridge/setup.py",
  "frappe_app/ham_bridge/MANIFEST.in",
  "frappe_app/ham_bridge/ham_bridge/**/*",
]
"hermes_agent_manager.image" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
