[project]
name = "hermes-agent-manager"
version = "0.1.1"
description = "Manage Hermes agents on a VPS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ham = "hermes_agent_manager.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_agent_manager", "hermes_agent_manager.*"]
namespaces = false

[tool.setuptools.package-data]
"hermes_agent_manager" = ["image/Dockerfile", "image/bashrc"]
"hermes_agent_manager.image" = ["Dockerfile", "bashrc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
